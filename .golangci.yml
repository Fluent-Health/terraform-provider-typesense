version: "2"
run:
  modules-download-mode: readonly
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*github.com/hashicorp/terraform-plugin-log/tflog.Logger).Debug
        - (*github.com/hashicorp/terraform-plugin-log/tflog.Logger).Info
        - (*github.com/hashicorp/terraform-plugin-log/tflog.Logger).Warn
    gosec:
      excludes:
        - G104
        - G304
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: var-naming
          disabled: true
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
          - unparam
        path: _test\.go
      - linters:
          - all
        path: .*\.pb\.go
      - linters:
          - lll
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - fluent-health-terraform-typesense
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
