name: Build and test
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  build-and-test:
    runs-on: ubuntu-latest
    services:
      typesense:
        image: typesense/typesense:30.1
        env:
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_API_KEY: test-api-key
          TYPESENSE_ENABLE_SEARCH_ANALYTICS: "true"
        ports:
          - 8108:8108
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11"
          terraform_wrapper: false

      - name: Wait for Typesense to be ready
        run: timeout 30 bash -c 'until curl -f http://localhost:8108/health > /dev/null 2>&1; do sleep 1; done'

      - name: Build
        run: make build

      - name: Unit tests
        run: go test -v -short ./...

      - name: Acceptance tests
        env:
          TYPESENSE_API_KEY: test-api-key
          TYPESENSE_API_ADDRESS: http://localhost:8108
          TF_ACC: "1"
        run: make testacc
